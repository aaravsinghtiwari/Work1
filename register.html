<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="register.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <form id="login">
    <h1>REGISTER</h1>

    <label for="email1">EMAIL:</label>
    <input id="email1" type="email" placeholder="Enter your email">

    <br><br>

    <label for="pass1">PASSWORD:</label>
    <input id="pass1" type="password" placeholder="Enter your password">

    <br><br>

    <div class="cf-turnstile" data-sitekey="0x4AAAAAADYBt5YXYk-K4L8e" id="cloud"></div>

    <br>

    <button type="submit">submit</button>

    <br>

    <a href="index.html">Already have an account? Sign in</a>
  </form>

  <script>
    document.querySelector("form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.querySelector("#email1").value;
      const password = document.querySelector("#pass1").value;

      const response = await fetch("https://work1-c3fk.vercel.app/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();
      alert(data.message);
    });
  </script>
</body>
</html>
